name: SSOT checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run SSOT guard
        run: python scripts/ssot-guard.py --registry config/ssot-registry.json
      - name: Run tests
        run: python -m unittest discover -s tests -v
